[package]
name = "intime"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64ct = { version = "1.8.3", features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
csv = "1.4.0"
moka = { version = "0.12.16", features = ["future"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
prost = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
web-push-native = { version = "0.5", default-features = false }
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
