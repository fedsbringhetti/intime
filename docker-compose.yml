# Deployment on the home server, in /home/federico/intime/. See docs/user/deploy.md.
services:
  intime:
    # Pin an exact version; to roll back, set the previous one and run `docker compose up -d`.
    image: federicosbringhetti/intime:0.2.0
    container_name: intime
    restart: unless-stopped
    ports:
      # Host port 8080 is taken; the service still listens on 8080 inside the container.
      - "8100:8080"
    volumes:
      # SQLite database. The folder must be writable by uid 10001 (see docs/user/deploy.md).
      - ./data:/data
    env_file: .env
    environment:
      TZ: Europe/Rome
    healthcheck:
      test: ["CMD", "intime", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 128m
